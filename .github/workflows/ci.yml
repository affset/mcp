name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check-all

  npm-pack:
    runs-on: ubuntu-latest
    needs: check-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      # npm 11's `publish --dry-run` errors if the version is already on the
      # registry, so CI would fail after every release. `pack --dry-run` still
      # validates the tarball (files, size) without that check.
      - run: npm pack --dry-run
